name: Poll for new Airbnb bookings

# Temporary scheduler while the Vercel project is on the Hobby plan, which
# only allows daily native cron jobs. Once upgraded to Vercel Pro, add a
# "crons" block back to vercel.json for native every-5-minutes scheduling
# and this workflow can be deleted (or left running harmlessly alongside it,
# since /api/cron/process-bookings is idempotent).
# SCHEDULE TEMPORARILY DISABLED (2026-07-31): a run against the unbounded
# Gmail search backlog created 21 real Master Trips records for historical
# bookings before timing out, likely duplicating already-existing manual
# entries. Re-enable the `schedule:` trigger below only after: (1) the
# duplicates are resolved, and (2) the Gmail query has a date/recency bound
# so it can never sweep up old bookings again.
on:
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call process-bookings endpoint
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.BOOKING_PIPELINE_URL }}/api/cron/process-bookings")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 400 ]; then
            echo "::error::process-bookings endpoint returned HTTP $status"
            exit 1
          fi
