name: Poll for new Airbnb bookings

# GitHub Actions' `schedule:` trigger turned out unreliable in practice (only
# fired once in over an hour on 2026-07-31, despite "*/5 * * * *" — a known
# GitHub limitation: scheduled workflows are best-effort and can be silently
# delayed or skipped, especially for low-traffic repos). Scheduling now
# happens via an external cron service (cron-job.org) hitting
# /api/cron/process-bookings directly with the CRON_SECRET bearer token.
#
# This workflow is kept for manual testing only (workflow_dispatch). Once
# upgraded to Vercel Pro, native `crons` in vercel.json would be the more
# "proper" choice, but cron-job.org works fine indefinitely on Hobby.
on:
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call process-bookings endpoint
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.BOOKING_PIPELINE_URL }}/api/cron/process-bookings")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 400 ]; then
            echo "::error::process-bookings endpoint returned HTTP $status"
            exit 1
          fi
